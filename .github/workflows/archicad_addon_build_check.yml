name: Archicad Add-On Build Check

# Fork build (Tapir Remiuma): only the one target that gets deployed here —
# Archicad 29 on Windows. Upstream builds AC25-29 for Win and Mac; running all
# ten jobs on every push would just burn minutes for artifacts nobody installs.
# The Mac jobs additionally need signing secrets this fork does not have.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build_win:
    strategy:
      fail-fast: false
      matrix:
        params:
          - acVersion: 29
            devKitUrl: https://github.com/GRAPHISOFT/archicad-api-devkit/releases/download/29.3000/API.Development.Kit.WIN.29.3000.zip
    runs-on: [ windows-2022 ]
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4
    - name: Download Development Kit
      run: python archicad-addon/Tools/download_and_unzip.py ${{ matrix.params.devKitUrl }} archicad-addon/Build/DevKits/AC${{ matrix.params.acVersion }}
    - name: Generate Project
      run: cmake -B archicad-addon/Build -G "Visual Studio 17 2022" -A "x64" -T "v143" -DAC_VERSION=${{ matrix.params.acVersion }} -DAC_API_DEVKIT_DIR="archicad-addon/Build/DevKits/AC${{ matrix.params.acVersion }}/Support" archicad-addon
    - name: Build RelWithDebInfo
      run: cmake --build archicad-addon/Build --config RelWithDebInfo
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Tapir Add-On AC${{ matrix.params.acVersion }} Win
        path: archicad-addon/Build/RelWithDebInfo/TapirAddOn_AC${{ matrix.params.acVersion }}_Win.apx
